<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello World</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at 50% 40%, #1b1b25, #0b0b0f 70%);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      overflow: hidden;
    }

    h1 {
      font-size: clamp(2.5rem, 12vw, 8rem);
      font-weight: 900;
      letter-spacing: -0.03em;
      white-space: nowrap;
      background: linear-gradient(90deg, #ff5f6d, #ffc371, #47e5bc, #6c8cff, #ff5f6d);
      background-size: 300% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: shake 0.4s infinite, flow 6s linear infinite;
      will-change: transform;
    }

    @keyframes shake {
      0%   { transform: translate(0, 0) rotate(0deg) scale(1); }
      10%  { transform: translate(-9px, 4px) rotate(-4deg) scale(1.03); }
      20%  { transform: translate(8px, -6px) rotate(5deg) scale(0.98); }
      30%  { transform: translate(-6px, -5px) rotate(3deg) scale(1.02); }
      40%  { transform: translate(10px, 5px) rotate(-5deg) scale(0.97); }
      50%  { transform: translate(-4px, 7px) rotate(4deg) scale(1.04); }
      60%  { transform: translate(7px, -3px) rotate(-3deg) scale(0.99); }
      70%  { transform: translate(-10px, -4px) rotate(5deg) scale(1.01); }
      80%  { transform: translate(5px, 6px) rotate(-4deg) scale(0.98); }
      90%  { transform: translate(-7px, 3px) rotate(2deg) scale(1.02); }
      100% { transform: translate(0, 0) rotate(0deg) scale(1); }
    }

    @keyframes flow {
      from { background-position: 0% 50%; }
      to   { background-position: 300% 50%; }
    }

    @media (prefers-reduced-motion: reduce) {
      h1 { animation: flow 6s linear infinite; }
    }
  </style>
</head>
<body>
  <h1>Hello World</h1>
</body>
</html>
